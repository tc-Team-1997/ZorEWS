# services/event-bus/docker-compose.yml
#
# Local Kafka-compatible broker for prototype dev. Redpanda is a single
# Go binary that speaks the Kafka 2.4+ wire protocol — no Zookeeper, no
# JVM, sub-second cold start. Production swaps in MSK / Confluent Cloud.
#
# Usage:
#   docker compose -f services/event-bus/docker-compose.yml up -d
#   APEX_BUS=kafka KAFKA_BROKERS=localhost:19092 npm run dev   # in any service
#   docker compose -f services/event-bus/docker-compose.yml down
#
# The Console UI lands at http://localhost:8089 — handy for inspecting
# topics + consumer groups without dropping into rpk.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: apex-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --default-log-level warn
    ports:
      - "19092:19092"  # Kafka API (external)
      - "18081:18081"  # Schema Registry
      - "18082:18082"  # Pandaproxy (REST proxy)
      - "9644:9644"    # Admin API
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 3s
      retries: 6

  console:
    image: redpandadata/console:v2.7.2
    container_name: apex-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_SCHEMA_REGISTRY_ENABLED: "true"
      KAFKA_SCHEMA_REGISTRY_URLS: "http://redpanda:8081"
