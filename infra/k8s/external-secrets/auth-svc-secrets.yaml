# auth-svc secrets — Aurora connection + JWT RS256 signing keys (private + public).
# JWT signing key rotated quarterly per docs/bau-runbook.md § monthly.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-svc-secrets
  namespace: apex-ews
  annotations:
    description: "auth-svc secrets — Aurora + JWT signing"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-svc-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        AUTH_SVC_PG_URL: "{{ .pg_url }}"
        JWT_PRIVATE_KEY: "{{ .jwt_private_key }}"
        JWT_PUBLIC_KEY: "{{ .jwt_public_key }}"
        JWT_KID: "{{ .jwt_kid }}"
  data:
    - secretKey: pg_url
      remoteRef:
        key: apex-ews/prod/auth-svc/pg-url
    - secretKey: jwt_private_key
      remoteRef:
        key: apex-ews/prod/auth-svc/jwt-private-key
    - secretKey: jwt_public_key
      remoteRef:
        key: apex-ews/prod/auth-svc/jwt-public-key
    - secretKey: jwt_kid
      remoteRef:
        key: apex-ews/prod/auth-svc/jwt-kid
