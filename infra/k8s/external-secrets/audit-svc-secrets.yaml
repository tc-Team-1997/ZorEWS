# audit-svc secrets — Python FastAPI writing to S3 audit bucket via IRSA + Aurora.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: audit-svc-secrets
  namespace: apex-ews
  annotations:
    description: "audit-svc — Aurora connection"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: audit-svc-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUDIT_DB_URL
      remoteRef: {key: apex-ews/prod/audit-svc/pg-url}
