# notification-svc secrets — outbound channel credentials.
# Per docs/vendor-accounts.md, 3 channels are wired:
#   - SES (email) — IAM role preferred; SES_FROM_ADDRESS as env var
#   - Africa's Talking (SMS) — API key + username
#   - FCM (Android push) — service account JSON
#   - APNS (iOS push) — .p8 token-based auth (binary blob)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-svc-secrets
  namespace: apex-ews
  annotations:
    description: "notification-svc — SES + AT + FCM + APNS"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target:
    name: notification-svc-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SES_FROM_ADDRESS: "{{ .ses_from_address }}"
        AT_API_KEY: "{{ .at_api_key }}"
        AT_USERNAME: "{{ .at_username }}"
        FCM_SERVICE_ACCOUNT: "{{ .fcm_service_account }}"
        APNS_KEY_ID: "{{ .apns_key_id }}"
        APNS_TEAM_ID: "{{ .apns_team_id }}"
        APNS_KEY: "{{ .apns_key }}"
  data:
    - secretKey: ses_from_address
      remoteRef: {key: apex-ews/prod/notification-svc/ses-from-address}
    - secretKey: at_api_key
      remoteRef: {key: apex-ews/prod/notification-svc/at-api-key}
    - secretKey: at_username
      remoteRef: {key: apex-ews/prod/notification-svc/at-username}
    - secretKey: fcm_service_account
      remoteRef: {key: apex-ews/prod/notification-svc/fcm-service-account}
    - secretKey: apns_key_id
      remoteRef: {key: apex-ews/prod/notification-svc/apns-key-id}
    - secretKey: apns_team_id
      remoteRef: {key: apex-ews/prod/notification-svc/apns-team-id}
    - secretKey: apns_key
      remoteRef: {key: apex-ews/prod/notification-svc/apns-key}
