# collection-adapter secrets — proxies case events to bank Collection module via mTLS.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: collection-adapter-secrets
  namespace: apex-ews
  annotations:
    description: "collection-adapter — cases-url + mTLS client cert/key from bank CA"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: collection-adapter-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        APEX_CASES_URL: "{{ .cases_url }}"
        MTLS_CLIENT_CERT: "{{ .mtls_cert }}"
        MTLS_CLIENT_KEY: "{{ .mtls_key }}"
  data:
    - secretKey: cases_url
      remoteRef: {key: apex-ews/prod/collection-adapter/cases-url}
    - secretKey: mtls_cert
      remoteRef: {key: apex-ews/prod/collection-adapter/mtls-client-cert}
    - secretKey: mtls_key
      remoteRef: {key: apex-ews/prod/collection-adapter/mtls-client-key}
