# ClusterSecretStore — the bridge between Kubernetes ExternalSecret CRDs and
# AWS Secrets Manager. IRSA-authenticated; no static AWS credentials in cluster.
#
# Secrets in Secrets Manager are namespaced under apex-ews/<env>/<service>/<key>:
#   apex-ews/prod/bff/pg-url
#   apex-ews/prod/bff/anthropic-api-key
#   apex-ews/prod/auth-svc/jwt-signing-key
#   ...
# See infra/k8s/external-secrets/*-secrets.yaml for the per-service mappings.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    description: "AWS Secrets Manager bridge for ZorEWS services"
    operationalization-phase: "T3-P3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        # IRSA — the ServiceAccount in the external-secrets namespace
        # is annotated with the IAM role ARN (via Terraform).
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
