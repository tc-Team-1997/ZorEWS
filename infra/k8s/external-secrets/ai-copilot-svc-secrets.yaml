# ai-copilot-svc secrets — Python FastAPI PD model serving + SHAP.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-copilot-svc-secrets
  namespace: apex-ews
  annotations:
    description: "ai-copilot-svc — Aurora reader + Anthropic"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-copilot-svc-secrets
    creationPolicy: Owner
  data:
    - secretKey: AI_COPILOT_PG_URL
      remoteRef: {key: apex-ews/prod/ai-copilot-svc/pg-url}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: apex-ews/prod/ai-copilot-svc/anthropic-api-key}
