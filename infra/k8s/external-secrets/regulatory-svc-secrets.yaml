# regulatory-svc family secrets — Aurora connection per service module.
# All 4 modules (cases, alerts, rules, indicators) share this manifest pattern;
# Aurora users + grants per-service are defined in data/schema/004_app_schemas.sql.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regulatory-svc-cases-secrets
  namespace: apex-ews
  annotations:
    description: "regulatory-svc/cases — Aurora + downstream service URLs"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: regulatory-svc-cases-secrets
    creationPolicy: Owner
  data:
    - secretKey: CASES_PG_URL
      remoteRef: {key: apex-ews/prod/regulatory-svc-cases/pg-url}
    - secretKey: APEX_AUDIT_URL
      remoteRef: {key: apex-ews/prod/regulatory-svc-cases/audit-url}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regulatory-svc-alerts-secrets
  namespace: apex-ews
spec:
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target: {name: regulatory-svc-alerts-secrets, creationPolicy: Owner}
  data:
    - secretKey: ALERTS_PG_URL
      remoteRef: {key: apex-ews/prod/regulatory-svc-alerts/pg-url}
    - secretKey: KAFKA_BROKERS
      remoteRef: {key: apex-ews/prod/regulatory-svc-alerts/kafka-brokers}
    - secretKey: APEX_CASES_URL
      remoteRef: {key: apex-ews/prod/regulatory-svc-alerts/cases-url}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regulatory-svc-rules-secrets
  namespace: apex-ews
spec:
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target: {name: regulatory-svc-rules-secrets, creationPolicy: Owner}
  data:
    - secretKey: RULES_PG_URL
      remoteRef: {key: apex-ews/prod/regulatory-svc-rules/pg-url}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: regulatory-svc-indicators-secrets
  namespace: apex-ews
spec:
  refreshInterval: 5m
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  target: {name: regulatory-svc-indicators-secrets, creationPolicy: Owner}
  data:
    - secretKey: INDICATORS_PG_URL
      remoteRef: {key: apex-ews/prod/regulatory-svc-indicators/pg-url}
    - secretKey: KAFKA_BROKERS
      remoteRef: {key: apex-ews/prod/regulatory-svc-indicators/kafka-brokers}
