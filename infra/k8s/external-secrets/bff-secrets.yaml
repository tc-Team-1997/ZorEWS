# BFF service secrets — connects to Aurora (writer + readers), MSK, JWKS, and
# external LLM (Anthropic) for the M7 AI/Copilot surface. All synced from
# AWS Secrets Manager via the ClusterSecretStore bridge.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bff-secrets
  namespace: apex-ews
  annotations:
    description: "BFF gateway secrets — Aurora + MSK + JWKS + Anthropic"
    operationalization-phase: "T3-P3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: bff-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        BFF_PG_URL: "{{ .pg_url }}"
        ANTHROPIC_API_KEY: "{{ .anthropic_api_key }}"
        KAFKA_BROKERS: "{{ .kafka_brokers }}"
        BFF_JWKS_URL: "{{ .jwks_url }}"
        APEX_CASES_URL: "{{ .cases_url }}"
  data:
    - secretKey: pg_url
      remoteRef:
        key: apex-ews/prod/bff/pg-url
    - secretKey: anthropic_api_key
      remoteRef:
        key: apex-ews/prod/bff/anthropic-api-key
    - secretKey: kafka_brokers
      remoteRef:
        key: apex-ews/prod/bff/kafka-brokers
    - secretKey: jwks_url
      remoteRef:
        key: apex-ews/prod/bff/jwks-url
    - secretKey: cases_url
      remoteRef:
        key: apex-ews/prod/bff/cases-url
