# Cluster + namespace-scoped roles for the four human role groups
# (admin, risk_analyst, supervisor, collection_officer/field_officer
# — the latter two never reach the cluster directly; access is via the
# REST API). RBAC here is for human operators only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apex-ews-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apex-ews-readonly
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apex-ews-risk-analyst
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apex-ews-supervisor
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apex-ews-admin
subjects:
  - kind: Group
    name: apex-ews:admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: apex-ews-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apex-ews-risk-analyst
subjects:
  - kind: Group
    name: apex-ews:risk-analysts
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: apex-ews-risk-analyst
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apex-ews-supervisor
subjects:
  - kind: Group
    name: apex-ews:supervisors
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: apex-ews-supervisor
  apiGroup: rbac.authorization.k8s.io
