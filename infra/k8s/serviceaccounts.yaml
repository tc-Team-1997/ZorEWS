# IRSA service accounts — annotation values must be patched by CI/CD with
# the IAM role ARN exported from infra/terraform/20-eks/outputs.tf
# (irsa_role_arns map). Placeholders below use ${IRSA_ROLE_ARN_<svc>}.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-svc
  namespace: platform
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_AUTH_SVC}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-svc
  namespace: platform
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_AUDIT_SVC}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-svc
  namespace: platform
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_NOTIFICATION_SVC}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-svc
  namespace: data
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_PIPELINE_SVC}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regulatory-svc
  namespace: regulatory
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_REGULATORY_SVC}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-copilot-svc
  namespace: ai
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_AI_COPILOT_SVC}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-svc
  namespace: analytics
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN_ANALYTICS_SVC}
