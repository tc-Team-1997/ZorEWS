# T4.4 — Karpenter NodePool + EC2NodeClass
#
# Applied AFTER the Karpenter controller Helm chart is installed (see
# README in this dir for the bootstrap sequence). Karpenter watches the
# K8s scheduler queue; when a pod fails to schedule because no node
# matches its requirements, Karpenter consults the NodePool + EC2NodeClass
# below to launch a right-sized node.
#
# Two NodePools:
#   1. `general` — covers everything except the AI workloads. Mix of
#      x86 + arm64, m6i/m7i/c7i families, spot-preferred.
#   2. `ai` — GPU-capable instances (g5.*), on-demand only (no spot for
#      GPU). Tainted so only ai-tagged pods land here.
#
# The EC2NodeClass declares the AMI family + IAM instance profile + tags.
# Karpenter discovers subnets + security groups via tag-based selectors
# matching the values set by Terraform (10-network applies the tags).
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: apex-ews-prod-karpenter-node   # matches aws_iam_role.node.name + instance-profile name
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: apex-ews-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: apex-ews-prod
  tags:
    project: apex-ews
    managed-by: karpenter
    apex-ews.io/env: prod
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 80Gi
        encrypted: true
        deleteOnTermination: true
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        workload: general
        provisioned-by: karpenter
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m6i", "m7i", "c7i", "m6a", "m7a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: topology.kubernetes.io/zone
          operator: In
          # Three AZs in af-south-1 (primary region); secondary region's
          # NodePool overrides these via its own Terraform apply.
          values: ["af-south-1a", "af-south-1b", "af-south-1c"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h   # 30 days — force a refresh
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"
  limits:
    cpu: "256"
    memory: 1024Gi
  weight: 50
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ai
spec:
  template:
    metadata:
      labels:
        workload: ai
        provisioned-by: karpenter
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5", "g6"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          # GPU instances are scarce on spot — on-demand only.
          operator: In
          values: ["on-demand"]
      # Match the existing `ai` node-group taint so only ai pods land here.
      taints:
        - key: workload
          value: ai
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 168h   # 7 days
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 300s
    budgets:
      - nodes: "1"
  limits:
    cpu: "64"
    memory: 256Gi
  weight: 10
