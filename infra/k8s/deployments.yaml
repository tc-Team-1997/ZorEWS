# Skeleton Deployments + Services for the seven APEX EWS microservices.
# Resource limits, image tags, and configmap/secret refs are placeholders
# wired up in CI/CD per environment.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: platform
  labels:
    app: auth-svc
    apex-ews.io/emits-audit: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
        apex-ews.io/emits-audit: "true"
    spec:
      serviceAccountName: auth-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-svc
          image: ${ECR_REGISTRY}/apex-ews/auth-svc:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: platform
spec:
  selector:
    app: auth-svc
  ports:
    - port: 8080
      targetPort: 8080
