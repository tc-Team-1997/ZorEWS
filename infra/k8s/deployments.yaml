apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot-svc
  namespace: ai
  labels:
    app: ai-copilot-svc
    apex-ews.io/emits-audit: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-copilot-svc
  template:
    metadata:
      labels:
        app: ai-copilot-svc
        apex-ews.io/emits-audit: "true"
    spec:
      serviceAccountName: ai-copilot-svc
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      nodeSelector:
        workload: ai
      containers:
        - name: ai-copilot-svc
          image: ${ECR_REGISTRY}/apex-ews/ai-copilot-svc:${IMAGE_TAG}
          ports:
            - containerPort: 8085
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot-svc
  namespace: ai
spec:
  selector:
    app: ai-copilot-svc
  ports:
    - port: 8085
      targetPort: 8085
