# Wave 1 — External Secrets Operator + ClusterSecretStore.
# Every service ExternalSecret manifest depends on the ESO CRDs being installed
# and the ClusterSecretStore (bridge to AWS Secrets Manager) being ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/tc-Team-1997/ZorEWS.git
    targetRevision: main
    path: infra/k8s/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, PruneLast=true, ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
