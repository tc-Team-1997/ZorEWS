# Wave 3 — observability stack (Prometheus + Loki + Grafana via kube-prometheus-stack
# Helm chart, plus our service-specific PrometheusRule CRDs for SLO recording rules
# and burn-rate alarms).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/tc-Team-1997/ZorEWS.git
    targetRevision: main
    path: infra/k8s/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, PruneLast=true, ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
