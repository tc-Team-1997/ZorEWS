openapi: 3.0.3
info:
  title: APEX EWS — Analytics Dashboard
  version: "1.0.0"
  description: |
    Sub-dashboards for the §5.5 Analytics Dashboard suite (T4.1 / EWS.docx §8).
    The full T4.1 scope is four sub-dashboards: risk-trend, pd-distribution,
    stage-migration, and alert-resolution. This document covers the
    alert-resolution endpoint that ships in the first slice; the other
    three will be appended as they land.

    Joins:
      `app_alerts.alerts` (lifecycle: created_at / acked_at / closed_at)

    Pure resolver — no per-request mutation. Same SLA buckets the
    SLA Breach Matrix uses (`dashboard:sla_breach_matrix:read`); analytics
    has its own RBAC op `dashboard:analytics:read`.

servers:
  - url: /v1
    description: Mounted on the BFF service (default port 8084)

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      in: header
      name: X-Tenant-ID
      required: true
      schema: { type: string, example: BANK_DEMO }
    Channel:
      in: header
      name: X-Channel
      required: true
      schema:
        type: string
        enum: [LOS, MOBILE, BRANCH, API, AGENT_PORTAL]
    ApexRole:
      in: header
      name: x-apex-role
      required: false
      schema:
        type: string
        enum: [admin, supervisor, risk_analyst, collection_officer, field_officer]

  schemas:
    AlertSeverity:
      type: string
      enum: [critical, high, medium, low]
    SeverityFilter:
      type: string
      enum: [critical, high, medium, low, all]

    FunnelStage:
      type: object
      required: [stage, count, ratio]
      properties:
        stage:
          type: string
          enum: [created, acked, investigated, closed]
        count: { type: integer, minimum: 0 }
        ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Conversion ratio against the `created` stage. Always 1.0 for `created` itself when there are rows.

    DurationStat:
      type: object
      required: [n, p50_sec, p95_sec, mean_sec]
      properties:
        n: { type: integer, minimum: 0, description: Sample size used for this percentile. }
        p50_sec: { type: integer, nullable: true }
        p95_sec: { type: integer, nullable: true }
        mean_sec: { type: integer, nullable: true }

    TrendBucket:
      type: object
      required: [week, created, acked, closed]
      properties:
        week: { type: string, example: "2026-W18" }
        created: { type: integer, minimum: 0 }
        acked: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0 }

    AlertResolutionFilter:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/SeverityFilter" }

    StageCode:
      type: string
      enum: [stage_1, stage_2, stage_3]
    StageMatrixCell:
      type: object
      required: [from, to, count]
      properties:
        from: { $ref: "#/components/schemas/StageCode" }
        to:   { $ref: "#/components/schemas/StageCode" }
        count: { type: integer, minimum: 0 }
    StageTotal:
      type: object
      required: [stage, current, prior, delta]
      properties:
        stage:   { $ref: "#/components/schemas/StageCode" }
        current: { type: integer, minimum: 0 }
        prior:   { type: integer, minimum: 0 }
        delta:   { type: integer }
    StageMigrationFilter:
      type: object
      properties:
        as_of:       { type: string, format: date-time }
        prior_as_of: { type: string, format: date-time }
        segment:     { type: string }
    StageMigrationReport:
      type: object
      required:
        - matrix
        - totals
        - upgrades_count
        - downgrades_count
        - stationary_count
        - new_customers_count
        - exited_customers_count
        - generated_at
        - tenant_id
        - filters_applied
      properties:
        matrix:
          type: array
          items: { $ref: "#/components/schemas/StageMatrixCell" }
          description: 9 cells in stable row-major order (stage_1→{1,2,3}, stage_2→{1,2,3}, stage_3→{1,2,3}).
        totals:
          type: array
          items: { $ref: "#/components/schemas/StageTotal" }
        upgrades_count:        { type: integer, minimum: 0 }
        downgrades_count:      { type: integer, minimum: 0 }
        stationary_count:      { type: integer, minimum: 0 }
        new_customers_count:   { type: integer, minimum: 0 }
        exited_customers_count: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }
        tenant_id:    { type: string }
        filters_applied: { $ref: "#/components/schemas/StageMigrationFilter" }

    PdRiskBand:
      type: string
      enum: [low, medium, high]
    PdHistogramBin:
      type: object
      required: [lower, upper, label, count, prior_count, delta]
      properties:
        lower: { type: number, format: float }
        upper: { type: number, format: float }
        label: { type: string, example: "0.0–1.0" }
        count: { type: integer, minimum: 0 }
        prior_count:
          type: integer
          nullable: true
          minimum: 0
          description: Same bin in the prior snapshot. null when no prior snapshot was loaded.
        delta:
          type: integer
          nullable: true
          description: count − prior_count. null when prior_count is null.
    PdRiskBandSlice:
      type: object
      required: [band, lower, upper, count]
      properties:
        band: { $ref: "#/components/schemas/PdRiskBand" }
        lower: { type: number, format: float }
        upper: { type: number, format: float }
        count: { type: integer, minimum: 0 }
    PdDistributionFilter:
      type: object
      properties:
        as_of: { type: string, format: date-time }
        prior_as_of: { type: string, format: date-time }
        segment: { type: string }
    PdDistributionReport:
      type: object
      required: [bins, bands, totals, range, generated_at, tenant_id, filters_applied]
      properties:
        bins:
          type: array
          items: { $ref: "#/components/schemas/PdHistogramBin" }
        bands:
          type: array
          items: { $ref: "#/components/schemas/PdRiskBandSlice" }
        totals:
          type: object
          required: [customer_count, prior_customer_count, mean_pd_proxy, high_band_share]
          properties:
            customer_count: { type: integer, minimum: 0 }
            prior_customer_count: { type: integer, nullable: true, minimum: 0 }
            mean_pd_proxy: { type: number, format: float, nullable: true }
            high_band_share: { type: number, format: float, minimum: 0, maximum: 1 }
        range:
          type: object
          required: [lower, upper, bin_count]
          properties:
            lower: { type: number, format: float }
            upper: { type: number, format: float }
            bin_count: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        tenant_id: { type: string }
        filters_applied: { $ref: "#/components/schemas/PdDistributionFilter" }

    RiskTrendBucket:
      type: object
      required: [week, week_start, total, by_severity, avg_criticality, high_critical_share]
      properties:
        week: { type: string, example: "2026-W18" }
        week_start: { type: string, format: date-time }
        total: { type: integer, minimum: 0 }
        by_severity:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: integer, minimum: 0 }
            high:     { type: integer, minimum: 0 }
            medium:   { type: integer, minimum: 0 }
            low:      { type: integer, minimum: 0 }
        avg_criticality:
          type: number
          format: float
          nullable: true
          description: Average criticality_score across alerts in this week.
        high_critical_share:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: (critical+high) / total in this week.

    RiskTrendFilter:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        segment:
          type: string
          description: Optional customer segment filter — only effective when the
            BFF has a customer→segment lookup wired (mart.customer_360 join).

    RiskTrendReport:
      type: object
      required: [buckets, totals, generated_at, tenant_id, filters_applied]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/RiskTrendBucket" }
        totals:
          type: object
          required: [alert_count, avg_criticality, high_critical_share]
          properties:
            alert_count: { type: integer, minimum: 0 }
            avg_criticality: { type: number, format: float, nullable: true }
            high_critical_share: { type: number, format: float, minimum: 0, maximum: 1 }
        generated_at: { type: string, format: date-time }
        tenant_id: { type: string }
        filters_applied: { $ref: "#/components/schemas/RiskTrendFilter" }

    AlertResolutionReport:
      type: object
      required:
        - funnel
        - ack_duration
        - close_duration
        - trend
        - generated_at
        - tenant_id
        - filters_applied
      properties:
        funnel:
          type: array
          items: { $ref: "#/components/schemas/FunnelStage" }
        ack_duration: { $ref: "#/components/schemas/DurationStat" }
        close_duration: { $ref: "#/components/schemas/DurationStat" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/TrendBucket" }
        generated_at: { type: string, format: date-time }
        tenant_id: { type: string }
        filters_applied: { $ref: "#/components/schemas/AlertResolutionFilter" }

    EwsHeader:
      type: object
      required: [status, requestId, timestamp]
      properties:
        status:    { type: string, enum: [SUCCESS, FAILURE] }
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
    EwsError:
      type: object
      required: [header, error]
      properties:
        header: { $ref: "#/components/schemas/EwsHeader" }
        error:
          type: object
          required: [code, message, severity]
          properties:
            code:
              type: string
              enum: [EWS_400_invalid_input, EWS_403_forbidden, EWS_500]
            message: { type: string }
            severity: { type: string, enum: [LOW, MEDIUM, HIGH] }

paths:
  /analytics/stage-migration:
    get:
      summary: 3×3 IFRS-9 stage transition matrix between two snapshots (T4.1 4d)
      operationId: getAnalyticsStageMigration
      tags: [analytics]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/ApexRole"
        - in: query
          name: as_of
          schema: { type: string, format: date-time }
        - in: query
          name: prior_as_of
          schema: { type: string, format: date-time }
        - in: query
          name: segment
          schema: { type: string }
      responses:
        "200":
          description: Transition matrix + per-stage totals + movement counts.
          content:
            application/json:
              schema:
                type: object
                required: [header, body]
                properties:
                  header: { $ref: "#/components/schemas/EwsHeader" }
                  body: { $ref: "#/components/schemas/StageMigrationReport" }
        "400":
          description: Invalid input (bad as_of / prior_as_of)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }
        "403":
          description: Caller's role lacks `dashboard:analytics:read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }

  /analytics/pd-distribution:
    get:
      summary: 10-bin histogram of latest PD-proxy per customer (T4.1 4c)
      operationId: getAnalyticsPdDistribution
      tags: [analytics]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/ApexRole"
        - in: query
          name: as_of
          schema: { type: string, format: date-time }
        - in: query
          name: prior_as_of
          schema: { type: string, format: date-time }
        - in: query
          name: segment
          schema: { type: string }
      responses:
        "200":
          description: Histogram + risk-band split + totals.
          content:
            application/json:
              schema:
                type: object
                required: [header, body]
                properties:
                  header: { $ref: "#/components/schemas/EwsHeader" }
                  body: { $ref: "#/components/schemas/PdDistributionReport" }
        "400":
          description: Invalid input (bad as_of / prior_as_of)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }
        "403":
          description: Caller's role lacks `dashboard:analytics:read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }

  /analytics/risk-trend:
    get:
      summary: Weekly alert counts by severity + avg criticality_score (T4.1 4b)
      operationId: getAnalyticsRiskTrend
      tags: [analytics]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/ApexRole"
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: segment
          schema: { type: string }
      responses:
        "200":
          description: Weekly buckets + portfolio totals.
          content:
            application/json:
              schema:
                type: object
                required: [header, body]
                properties:
                  header: { $ref: "#/components/schemas/EwsHeader" }
                  body: { $ref: "#/components/schemas/RiskTrendReport" }
        "400":
          description: Invalid input (bad from/to date)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }
        "403":
          description: Caller's role lacks `dashboard:analytics:read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }

  /analytics/alert-resolution:
    get:
      summary: Alert lifecycle funnel + p50/p95 ack/close durations + weekly trend
      operationId: getAnalyticsAlertResolution
      tags: [analytics]
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/ApexRole"
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: severity
          schema: { $ref: "#/components/schemas/SeverityFilter" }
      responses:
        "200":
          description: Resolution funnel + percentile durations + trend.
          content:
            application/json:
              schema:
                type: object
                required: [header, body]
                properties:
                  header: { $ref: "#/components/schemas/EwsHeader" }
                  body: { $ref: "#/components/schemas/AlertResolutionReport" }
        "400":
          description: Invalid input (bad severity, bad from/to date)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }
        "403":
          description: Caller's role lacks `dashboard:analytics:read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EwsError" }
