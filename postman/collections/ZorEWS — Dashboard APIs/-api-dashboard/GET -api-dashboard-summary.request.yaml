$kind: http-request
name: GET /api/dashboard/summary
order: 1000
method: GET
url: '{{bff_url}}/api/dashboard/summary'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Smoke assertion — accepts any documented status for GET /api/dashboard/summary
      pm.test('status is documented', () => {
        pm.expect([200, 204, 400, 401, 403, 404, 409, 501, 503]).to.include(pm.response.code);
      });
      pm.test('responds in < 5s', () => {
        pm.expect(pm.response.responseTime).to.be.below(5000);
      });
