$kind: http-request
order: 5000
method: PUT
url: '{{baseUrl}}/v1/ews/rules/{{ruleId}}'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "rule_id": "RULE_CREDIT_001",
      "name": "High EMI Bounce Risk (v2)",
      "category": "credit",
      "description": "3+ EMI bounces in 90 days — escalated severity per Q2 review.",
      "conditions": [
        { "field": "emi_bounce_count_90d", "operator": ">=", "value": 3 }
      ],
      "logic": "AND",
      "action": { "alert_severity": "RED", "weight": 30 }
    }
