$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/v1/ews/rules'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "rule_id": "RULE_CREDIT_001",
      "name": "High EMI Bounce Risk",
      "category": "credit",
      "description": "3+ EMI bounces in 90 days indicates servicing distress.",
      "conditions": [
        { "field": "emi_bounce_count_90d", "operator": ">=", "value": 3 }
      ],
      "logic": "AND",
      "action": {
        "alert_severity": "RED",
        "weight": 25,
        "recommended_action": "Pause disbursement; assign to RM for 24-hour callback."
      },
      "is_active": true
    }
