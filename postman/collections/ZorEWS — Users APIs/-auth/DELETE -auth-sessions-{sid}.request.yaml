$kind: http-request
name: 'DELETE /auth/sessions/{sid}'
order: 23000
method: DELETE
url: '{{auth_svc_url}}/auth/sessions/:sid'
pathVariables:
  - key: sid
    value: '{{session_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Smoke assertion — accepts any documented status for DELETE /auth/sessions/{sid}
      pm.test('status is documented', () => {
        pm.expect([204, 200, 400, 401, 403, 404, 409, 501, 503]).to.include(pm.response.code);
      });
      pm.test('responds in < 5s', () => {
        pm.expect(pm.response.responseTime).to.be.below(5000);
      });
