$kind: http-request
name: GET /auth/service-clients
order: 18000
method: GET
url: '{{auth_svc_url}}/auth/service-clients'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Smoke assertion — accepts any documented status for GET /auth/service-clients
      pm.test('status is documented', () => {
        pm.expect([200, 204, 400, 401, 403, 404, 409, 501, 503]).to.include(pm.response.code);
      });
      pm.test('responds in < 5s', () => {
        pm.expect(pm.response.responseTime).to.be.below(5000);
      });
