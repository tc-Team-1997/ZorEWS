$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/v1/reports/builder/preview'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "source_id": "mart.customer_360",
      "filters": {
        "children": [
          {
            "field": "risk_level",
            "op": "eq",
            "value": "High"
          },
          {
            "field": "pd_score",
            "op": "gt",
            "value": 0.5
          }
        ],
        "op": "AND"
      },
      "limit": 50
    }
