$kind: http-request
order: 8000
method: PATCH
url: '{{baseUrl}}/v1/reports/builder/saved/{{savedReportId}}'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "name": "High-risk customers (renamed)",
      "tags": [
        "risk",
        "daily",
        "watchlist"
      ]
    }
