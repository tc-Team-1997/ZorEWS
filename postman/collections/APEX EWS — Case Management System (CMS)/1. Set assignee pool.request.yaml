$kind: http-request
order: 2000
method: PUT
url: '{{baseUrl}}/v1/cms/automation/pool'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "members": ["alice", "bob", "carol"]
    }
