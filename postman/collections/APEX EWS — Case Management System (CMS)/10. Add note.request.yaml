$kind: http-request
order: 11000
method: POST
url: '{{baseUrl}}/v1/cms/cases/{{caseId}}/notes'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "note_text": "Met customer at branch — they confirmed payment plan",
      "is_internal": false
    }
