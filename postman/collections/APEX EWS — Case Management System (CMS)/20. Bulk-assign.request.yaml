$kind: http-request
order: 21000
method: POST
url: '{{baseUrl}}/v1/cms/cases/bulk-assign'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "case_ids": ["{{caseId}}"],
      "assigned_to": "alice",
      "reason": "team rotation"
    }
