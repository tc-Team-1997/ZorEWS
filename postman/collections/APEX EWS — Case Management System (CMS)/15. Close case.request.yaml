$kind: http-request
order: 16000
method: POST
url: '{{baseUrl}}/v1/cms/cases/{{caseId}}/close'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "resolution_category": "mitigated",
      "resolution_notes": "Customer settled outstanding EMI; payment plan in place"
    }
