$kind: http-request
name: ✅ Happy path — GET /api/customers
order: 1000
method: GET
url: '{{bff_url}}/api/customers'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('2xx or 401 (no auth in env)', () => {
        pm.expect([200, 201, 401, 403]).to.include(pm.response.code);
      });
