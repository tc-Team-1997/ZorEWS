$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/v1/copilot/v2/chat'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "message": "Explain the KRI breakdown",
      "conversation_id": "{{conversationId}}",
      "context": {
        "page": "customer",
        "entity": {
          "type": "customer", "id": "cust-001", "label": "Acme Pvt Ltd",
          "facts": { "red_count": 4, "orange_count": 6, "top_driver": "FIN-001", "kri_FIN_001": 0.88 }
        }
      }
    }
