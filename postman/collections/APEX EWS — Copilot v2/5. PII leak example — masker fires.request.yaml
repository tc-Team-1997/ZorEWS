$kind: http-request
order: 6000
method: POST
url: '{{baseUrl}}/v1/copilot/v2/chat'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "message": "Email jane@bil.com about cust-001 (PAN ABCDE1234F, phone +91 9876543210)"
    }
