$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/v1/copilot/v2/chat'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{apexUser}}'
  - key: x-apex-role
    value: '{{apexRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "message": "Summarize this alert in 2 lines",
      "context": {
        "page": "alerts",
        "entity": {
          "type": "alert", "id": "alrt-007",
          "label": "Payment bounce alert",
          "facts": { "severity": "high", "customer_id": "cust-002", "rule_name": "High EMI Bounce Risk", "reason_summary": "5 EMI bounces in last 90 days" }
        }
      }
    }
