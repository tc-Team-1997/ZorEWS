$kind: http-request
name: GET /.well-known/jwks.json
order: 1000
method: GET
url: '{{auth_svc_url}}/.well-known/jwks.json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Smoke assertion — accepts any documented status for GET /.well-known/jwks.json
      pm.test('status is documented', () => {
        pm.expect([200, 204, 400, 401, 403, 404, 409, 501, 503]).to.include(pm.response.code);
      });
      pm.test('responds in < 5s', () => {
        pm.expect(pm.response.responseTime).to.be.below(5000);
      });
