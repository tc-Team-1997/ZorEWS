$kind: http-request
order: 10000
method: POST
url: '{{baseUrl}}/v1/ews/rules/{{ruleId}}/clone'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{maker}}'
  - key: x-apex-role
    value: '{{makerRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: '{ "new_rule_id": "{{cloneRuleId}}", "new_name": "RP demo — tighter clone" }'
