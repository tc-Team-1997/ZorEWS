$kind: http-request
order: 8000
method: POST
url: '{{baseUrl}}/v1/ews/rules/{{ruleId}}/versions/diff'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{maker}}'
  - key: x-apex-role
    value: '{{makerRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: '{ "from": "0.1.0", "to": "0.2.0" }'
