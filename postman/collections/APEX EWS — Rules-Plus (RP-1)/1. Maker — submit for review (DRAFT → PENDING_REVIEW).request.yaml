$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/v1/ews/rules/{{ruleId}}/submit'
headers:
  - key: X-Tenant-ID
    value: '{{tenantId}}'
  - key: X-Channel
    value: '{{channel}}'
  - key: X-APEX-USER
    value: '{{maker}}'
  - key: x-apex-role
    value: '{{makerRole}}'
  - key: Content-Type
    value: application/json
body:
  type: text
  content: '{ "reason": "Threshold tuned per April loss review" }'
